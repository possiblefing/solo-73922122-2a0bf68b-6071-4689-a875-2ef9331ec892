# Round-robin across the two API instances. Uploads and queries stay
# available even while one instance is processing a slow batch or restarting.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream fab_api {
        server api1:8000 max_fails=3 fail_timeout=5s;
        server api2:8000 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    upstream fab_receiver {
        server receiver:8000 max_fails=3 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 12m;

        # Delivery status/API and the independent receiver.  Receiver routes
        # are all under /analysis, so they can be proxied without rewriting.
        location /analysis/ {
            proxy_pass http://fab_receiver;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://fab_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
